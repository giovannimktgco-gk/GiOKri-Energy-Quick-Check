<body>



<div class="container">



<h1>GiOKri Energy</h1>

<h2>Quick Check</h2>



<div class="box">



<label>Tipo energia</label>


<select 
id="energia" 
onchange="cambiaScenario()">


<option value="LUCE">
LUCE
</option>


<option value="GAS">
GAS
</option>


</select>




<label>Consumo annuo</label>

<small>Consumo mensile × 12</small>


<input

type="number"

id="consumo"

placeholder="es. 6000"

>




<label>Prezzo energia attuale</label>

<small>
Scontrino dell'Energia → Quota consumi → di cui vendita energia elettrica/gas
</small>


<input

type="number"

id="prezzoAttuale"

step="0.000001"

placeholder="€/kWh o €/Smc"

>




<label>Quota fissa mensile</label>

<small>
Scontrino dell'Energia → Quota fissa → di cui vendita energia elettrica/gas
</small>


<input

type="number"

id="quotaAttuale"

step="0.01"

placeholder="€/mese"

>




<button
id="btnAnalizza"
onclick="analizza()"
disabled>

⏳ Caricamento...

</button>



</div>




<div 
id="risultato" 
class="risultato">


Inserisci i dati e premi ANALIZZA


</div>




</div>
