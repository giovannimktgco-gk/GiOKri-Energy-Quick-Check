<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GiOKri Energy Quick Check</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="container">

<h1>GiOKri Energy</h1>
<h2>Quick Check</h2>

<div class="box">

<label>Tipo energia</label>

<select id="energia" onchange="cambiaScenario()">
<option value="LUCE">LUCE</option>
<option value="GAS">GAS</option>
</select>


<label>Consumo annuo</label>

<input 
type="number"
id="consumo"
placeholder="es. 6000">


<label>Prezzo energia attuale</label>

<input 
type="number"
id="prezzoAttuale"
step="0.000001"
placeholder="€/kWh o €/Smc">


<label>Quota fissa mensile</label>

<input 
type="number"
id="quotaAttuale"
step="0.01"
placeholder="€/mese">


<button onclick="analizza()">
ANALIZZA
</button>

</div>


<div id="risultato" class="risultato">

Inserisci i dati e premi ANALIZZA

</div>


</div>


<script src="app.js"></script>

</body>
</html>
